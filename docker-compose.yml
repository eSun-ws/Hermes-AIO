# =============================================================================
# Hermes All-in-One v2 — compose (thin image + online install on first boot)
# -----------------------------------------------------------------------------
# Quick start (init.sh is recommended; it handles --env-file and every check):
#   cp config/.env.example config/.env      # edit as needed
#   docker compose --env-file config/.env up -d --build
#
# WARNING: the configuration lives in config/.env. Compose only auto-reads a
# project-root ".env" for ${VAR} interpolation, so every command must pass
# --env-file config/.env explicitly (init.sh does it for you).
#
# Data volumes (survive upgrades and container recreation):
#   src/         -> /app/src            hermes source + webui source (hermes update writes here)
#   hermes-data/ -> /app/hermes-agent   HERMES_HOME (environments, tools, config, sessions)
#   workspace/   -> /workspace          default agent workspace
# =============================================================================

services:
  hermes:
    build:
      context: .
      dockerfile: config/Dockerfile
    image: hermes-allinone-v2:latest
    container_name: hermes-allinone
    restart: unless-stopped

    env_file:
      - config/.env

    environment:
      # Layout (matches the environment variables the official installer expects)
      HERMES_HOME: /app/hermes-agent
      HERMES_INSTALL_DIR: /app/src/Hermes
      HERMES_WEBUI_DIR: /app/src/WebUI

      # WebUI
      HERMES_WEBUI_HOST: ${HERMES_WEBUI_HOST:-0.0.0.0}
      HERMES_WEBUI_PORT: ${HERMES_WEBUI_PORT:-8787}
      HERMES_WEBUI_BOT_NAME: ${HERMES_WEBUI_BOT_NAME:-Hermes}
      HERMES_WEBUI_STATE_DIR: /app/hermes-agent/webui
      HERMES_CONFIG_PATH: /app/hermes-agent/config.yaml

      # Source channel and update cadence
      HERMES_CHANNEL: ${HERMES_CHANNEL:-stable}
      UPDATE_AGENT_TIME: ${UPDATE_AGENT_TIME:-48}
      UPDATE_WEBUI_TIME: ${UPDATE_WEBUI_TIME:-48}

      # Dashboard (optional)
      HERMES_DASHBOARD_ON: ${HERMES_DASHBOARD_ON:-0}
      HERMES_DASHBOARD_HOST: ${HERMES_DASHBOARD_HOST:-0.0.0.0}
      HERMES_DASHBOARD_PORT: ${HERMES_DASHBOARD_PORT:-9119}
      # WARNING: forward only our own variable name. If
      # HERMES_DASHBOARD_BASIC_AUTH_USERNAME reaches the container environment, the
      # agent refuses to start ("a username but no password") and the WebUI will not open.
      DASH_BASIC_AUTH_USER: ${DASH_BASIC_AUTH_USER:-hermes}

      # Gateway / OpenAI-compatible endpoint (8642 must be available)
      HERMES_API_GW: ${HERMES_API_GW:-1}
      API_SERVER_ENABLED: ${HERMES_API_GW:-1}
      API_SERVER_HOST: ${API_SERVER_HOST:-0.0.0.0}
      API_SERVER_PORT: ${API_SERVER_PORT:-8642}

      # hindsight plugin: source + dependencies are prepared by bootstrap; the provider
      # itself is left unset so the user decides in the Dashboard.
      HINDSIGHT_PLUGIN: ${HINDSIGHT_PLUGIN:-on}
      HINDSIGHT_PREPARE: ${HINDSIGHT_PREPARE:-1}
      HINDSIGHT_ENABLE: ${HINDSIGHT_ENABLE:-0}

      # Whether the first install skips the browser / computer-use components
      # (saves time and image size)
      HERMES_SKIP_BROWSER: ${HERMES_SKIP_BROWSER:-0}
      HERMES_SKIP_COMPUTER_USE: ${HERMES_SKIP_COMPUTER_USE:-0}

    ports:
      - "${HERMES_WEBUI_PORT:-8787}:${HERMES_WEBUI_PORT:-8787}"
      - "${HERMES_DASHBOARD_PORT:-9119}:${HERMES_DASHBOARD_PORT:-9119}"
      - "${API_SERVER_PORT:-8642}:${API_SERVER_PORT:-8642}"
      - "${OPEN_PORT:-3111-3113}:${OPEN_PORT:-3111-3113}"

    volumes:
      - ${HOST_SRC_DIR:-./src}:/app/src
      - ${HOST_HERMES_HOME:-./hermes-data}:/app/hermes-agent
      - ${HOST_WORKSPACE:-./workspace}:/workspace

    stop_grace_period: 30s
